<h1>GESTIÓN USUARIOS</h1>
<form [formGroup]="usuarioForm">
    <label for="">Ingrese Nombre: </label>
    <input type="email" formControlName="nombreUsuario">
    <br>
    <label for="">Ingrese Contraseña: </label>
    <input type="password" formControlName="contrasenia">
    <br>
    <button (click)="guardarUsuario()" >Registrar Usuario</button>
</form>


<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>ACCIONES</th>
        </tr>
    </thead>
    <tbody>
        @for (usuario of usuarios(); track $index) {
            <tr>
                <td>{{ $index+1 }}</td>
                <td>{{ usuario.nombreUsuario }}</td>
                <td><button (click)="editarUsuario(usuario)">CONFIRMAR</button><button (click)="mostrarUsuario(usuario)">Editar</button></td>
            </tr>
        }
    </tbody>
</table>
